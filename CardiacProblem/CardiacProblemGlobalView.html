<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健診心臟科問題</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red-50: #FCEBEB;
    --red-100: #F7C1C1;
    --red-200: #F09595;
    --red-400: #E24B4A;
    --red-600: #A32D2D;
    --red-800: #791F1F;
    --red-900: #501313;
    --teal-50: #E1F5EE;
    --teal-100: #9FE1CB;
    --teal-400: #1D9E75;
    --teal-600: #0F6E56;
    --teal-800: #085041;
    --blue-50: #E6F1FB;
    --blue-100: #B5D4F4;
    --blue-400: #378ADD;
    --blue-600: #185FA5;
    --blue-800: #0C447C;
    --amber-50: #FAEEDA;
    --amber-100: #FAC775;
    --amber-400: #BA7517;
    --amber-600: #854F0B;
    --amber-800: #633806;
    --gray-50: #F1EFE8;
    --gray-100: #D3D1C7;
    --gray-400: #888780;
    --gray-600: #5F5E5A;
    --gray-800: #444441;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #f8f5f0;
    min-height: 100vh;
    color: #2a2a2a;
  }

  .hero {
    background: var(--red-800);
    padding: 3rem 2rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px; right: -40px;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }

  .hero-icon {
    font-size: 3rem;
    margin-bottom: 0.75rem;
    display: block;
    position: relative;
    z-index: 1;
  }

  .hero h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.9rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    margin-bottom: 0.5rem;
    position: relative;
    z-index: 1;
  }

  .hero p {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.05em;
    position: relative;
    z-index: 1;
  }

  .section-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--gray-600);
    text-transform: uppercase;
    padding: 1.8rem 1.5rem 0.6rem;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
    padding: 0 1.5rem 2rem;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid rgba(0,0,0,0.07);
    padding: 1.4rem 1.5rem;
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.09);
    border-color: rgba(0,0,0,0.14);
  }

  .card:active {
    transform: translateY(0);
  }

  .card-icon-wrap {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
  }

  .icon-red    { background: var(--red-50);  color: var(--red-700, #791F1F); }
  .icon-teal   { background: var(--teal-50); color: var(--teal-600); }
  .icon-blue   { background: var(--blue-50); color: var(--blue-600); }
  .icon-amber  { background: var(--amber-50); color: var(--amber-600); }

  .card-body { flex: 1; }

  .card-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 0.3rem;
    line-height: 1.3;
  }

  .card-desc {
    font-size: 0.82rem;
    color: var(--gray-600);
    line-height: 1.6;
  }

  .card-arrow {
    font-size: 1rem;
    color: var(--gray-400);
    margin-top: 2px;
    flex-shrink: 0;
    transition: transform 0.18s ease, color 0.18s ease;
  }

  .card:hover .card-arrow {
    transform: translateX(3px);
    color: var(--red-400);
  }

  .divider {
    height: 1px;
    background: rgba(0,0,0,0.06);
    margin: 0 1.5rem;
  }

  .footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.75rem;
    color: var(--gray-400);
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="hero">
  <span class="hero-icon">🫀</span>
  <h1>健診心臟科問題</h1>
  <p>Cardiac Problems — Health Examination</p>
</div>

<div class="section-label">評估工具</div>

<div class="cards-grid">

  <a class="card" href="PalpitationEvaluation.html">
    <div class="card-icon-wrap icon-red">💓</div>
    <div class="card-body">
      <div class="card-title">心悸評估</div>
      <div class="card-desc">Palpitation Evaluation<br>系統性評估心悸症狀與臨床決策</div>
    </div>
    <div class="card-arrow">›</div>
  </a>

  <a class="card" href="PalpitationGlobalView.html">
    <div class="card-icon-wrap icon-teal">📋</div>
    <div class="card-body">
      <div class="card-title">心悸全覽</div>
      <div class="card-desc">Palpitation Global View<br>心悸相關知識與全面概覽</div>
    </div>
    <div class="card-arrow">›</div>
  </a>

  <a class="card" href="AboutEKGQuiz.html">
    <div class="card-icon-wrap icon-blue">📈</div>
    <div class="card-body">
      <div class="card-title">心電圖測驗</div>
      <div class="card-desc">EKG Quiz<br>心電圖判讀練習與互動測驗</div>
    </div>
    <div class="card-arrow">›</div>
  </a>

</div>

<div class="divider"></div>

<div class="section-label">綜合檢視</div>

<div class="cards-grid">

  <a class="card" href="CardiacProblemGlobalView.html">
    <div class="card-icon-wrap icon-amber">🔬</div>
    <div class="card-body">
      <div class="card-title">心臟問題全覽</div>
      <div class="card-desc">Cardiac Problem Global View<br>健診心臟科問題總覽與分析</div>
    </div>
    <div class="card-arrow">›</div>
  </a>

</div>

<div class="footer">DRJimmyHealthExaminationMedicalEducation</div>

</body>
</html>
